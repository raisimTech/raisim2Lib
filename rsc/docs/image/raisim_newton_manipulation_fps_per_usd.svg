<svg xmlns="http://www.w3.org/2000/svg" width="960" height="730" viewBox="0 0 960 730" role="img" aria-labelledby="title desc">
  <title id="title">Robotiq manipulation</title>
  <desc id="desc">Robotiq manipulation: grouped columns of the physics steps per second per dollar of RaiSim on a Core Ultra 7 265K CPU and Newton on an RTX 5070 GPU at 8 world counts. Higher is better. RaiSim is not measured at 8,096 worlds. Hatched Newton columns failed validation.</desc>
