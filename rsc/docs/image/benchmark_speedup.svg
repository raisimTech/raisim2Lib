<svg xmlns="http://www.w3.org/2000/svg" width="960" height="578" viewBox="0 0 960 578" role="img" aria-labelledby="title desc">
  <title id="title">RaiSim speedup over MuJoCo</title>
  <desc id="desc">Horizontal bars for 10 valid comparisons, using unrounded medians of three single-threaded runs: MuJoCo&#x27;s time divided by RaiSim&#x27;s. Values above one mean RaiSim is faster. The axis is logarithmic.</desc>
  <style>text { font-family: Arial, Helvetica, sans-serif; fill: #24313d; }
    .title { font-size: 30px; font-weight: 700; }
    .subtitle { font-size: 19px; fill: #596674; }
    .panel { font-size: 21px; font-weight: 700; }
    .label { font-size: 19px; }
    .value { font-size: 19px; font-weight: 700; }
    .note { font-size: 18px; fill: #596674; }
    .tick { font-size: 18px; fill: #596674; }
    .grid { stroke: #e1e4e5; stroke-width: 1; }
    .axis { stroke: #a8b4bf; stroke-width: 1; }
    .reference { stroke: #596674; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .raisim { fill: #2a78d6; }
    .rayrai { fill: #eb6834; }
    .other { fill: #a9a8a0; }
    .other-dark { fill: #6f6d66; }
    .failed { fill: url(#failed); }</style>
  <defs><pattern id="failed" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e4e3de"/><rect width="3" height="8" fill="#6f6d66"/></pattern></defs>
  <rect width="960" height="578" fill="#fff"/>
  <text x="32.0" y="44.0" class="title">RaiSim speedup over MuJoCo</text>
  <text x="32.0" y="76.0" class="subtitle">MuJoCo time ÷ RaiSim time, higher is better · median of three runs · AMD Ryzen 9 3950X</text>
  <line x1="272.0" y1="100" x2="272.0" y2="464" class="grid"/>
  <line x1="333.0" y1="100" x2="333.0" y2="464" class="grid"/>
  <line x1="394.0" y1="100" x2="394.0" y2="464" class="grid"/>
  <line x1="455.0" y1="100" x2="455.0" y2="464" class="grid"/>
  <line x1="516.0" y1="100" x2="516.0" y2="464" class="grid"/>
  <line x1="577.0" y1="100" x2="577.0" y2="464" class="grid"/>
  <line x1="638.0" y1="100" x2="638.0" y2="464" class="grid"/>
  <line x1="699.0" y1="100" x2="699.0" y2="464" class="grid"/>
  <line x1="760.0" y1="100" x2="760.0" y2="464" class="grid"/>
  <line x1="272.0" y1="100" x2="272.0" y2="464" class="reference"/>
  <line x1="272" y1="100" x2="272" y2="464" class="axis"/>
  <text x="260.0" y="128.0" text-anchor="end" class="label">Chain, 10 links</text>
  <path d="M272.0 111.0H385.0A4.0 4.0 0 0 1 389.0 115.0V129.0A4.0 4.0 0 0 1 385.0 133.0H272.0Z" class="raisim"><title>Chain, 10 links: MuJoCo takes 3.78 times as long</title></path>
  <text x="397.0" y="128.0" class="value">3.78×</text>
  <text x="260.0" y="164.0" text-anchor="end" class="label">Chain, 20 links</text>
  <path d="M272.0 147.0H438.7A4.0 4.0 0 0 1 442.7 151.0V165.0A4.0 4.0 0 0 1 438.7 169.0H272.0Z" class="raisim"><title>Chain, 20 links: MuJoCo takes 6.96 times as long</title></path>
  <text x="450.7" y="164.0" class="value">6.96×</text>
  <text x="260.0" y="200.0" text-anchor="end" class="label">ANYmal standing</text>
  <path d="M272.0 183.0H350.8A4.0 4.0 0 0 1 354.8 187.0V201.0A4.0 4.0 0 0 1 350.8 205.0H272.0Z" class="raisim"><title>ANYmal standing: MuJoCo takes 2.56 times as long</title></path>
  <text x="362.8" y="200.0" class="value">2.56×</text>
  <text x="260.0" y="236.0" text-anchor="end" class="label">ANYmal falling</text>
  <path d="M272.0 219.0H352.3A4.0 4.0 0 0 1 356.3 223.0V237.0A4.0 4.0 0 0 1 352.3 241.0H272.0Z" class="raisim"><title>ANYmal falling: MuJoCo takes 2.61 times as long</title></path>
  <text x="364.3" y="236.0" class="value">2.61×</text>
  <text x="260.0" y="272.0" text-anchor="end" class="label">ANYmal on heightmap</text>
  <path d="M272.0 255.0H406.2A4.0 4.0 0 0 1 410.2 259.0V273.0A4.0 4.0 0 0 1 406.2 277.0H272.0Z" class="raisim"><title>ANYmal on heightmap: MuJoCo takes 4.81 times as long</title></path>
  <text x="418.2" y="272.0" class="value">4.81×</text>
  <text x="260.0" y="308.0" text-anchor="end" class="label">Primitive speed</text>
  <path d="M272.0 291.0H343.5A4.0 4.0 0 0 1 347.5 295.0V309.0A4.0 4.0 0 0 1 343.5 313.0H272.0Z" class="raisim"><title>Primitive speed: MuJoCo takes 2.36 times as long</title></path>
  <text x="355.5" y="308.0" class="value">2.36×</text>
  <text x="260.0" y="344.0" text-anchor="end" class="label">Strandbeest</text>
  <path d="M272.0 327.0H356.8A4.0 4.0 0 0 1 360.8 331.0V345.0A4.0 4.0 0 0 1 356.8 349.0H272.0Z" class="raisim"><title>Strandbeest: MuJoCo takes 2.74 times as long</title></path>
  <text x="368.8" y="344.0" class="value">2.74×</text>
  <text x="260.0" y="380.0" text-anchor="end" class="label">Heightmap LiDAR</text>
  <path d="M272.0 363.0H553.8A4.0 4.0 0 0 1 557.8 367.0V381.0A4.0 4.0 0 0 1 553.8 385.0H272.0Z" class="raisim"><title>Heightmap LiDAR: MuJoCo takes 25.71 times as long</title></path>
  <text x="565.8" y="380.0" class="value">25.71×</text>
  <text x="260.0" y="416.0" text-anchor="end" class="label">Primitive ray scaling</text>
  <path d="M272.0 399.0H707.3A4.0 4.0 0 0 1 711.3 403.0V417.0A4.0 4.0 0 0 1 707.3 421.0H272.0Z" class="raisim"><title>Primitive ray scaling: MuJoCo takes 147.16 times as long</title></path>
  <text x="719.3" y="416.0" class="value">147.16×</text>
  <text x="260.0" y="452.0" text-anchor="end" class="label">Deformable cloth</text>
  <path d="M272.0 435.0H486.1A4.0 4.0 0 0 1 490.1 439.0V453.0A4.0 4.0 0 0 1 486.1 457.0H272.0Z" class="raisim"><title>Deformable cloth: MuJoCo takes 11.92 times as long</title></path>
  <text x="498.1" y="452.0" class="value">11.92×</text>
  <text x="272.0" y="488.0" text-anchor="middle" class="tick">1×</text>
  <text x="333.0" y="488.0" text-anchor="middle" class="tick">2×</text>
  <text x="394.0" y="488.0" text-anchor="middle" class="tick">4×</text>
  <text x="455.0" y="488.0" text-anchor="middle" class="tick">8×</text>
  <text x="516.0" y="488.0" text-anchor="middle" class="tick">16×</text>
  <text x="577.0" y="488.0" text-anchor="middle" class="tick">32×</text>
  <text x="638.0" y="488.0" text-anchor="middle" class="tick">64×</text>
  <text x="699.0" y="488.0" text-anchor="middle" class="tick">128×</text>
  <text x="760.0" y="488.0" text-anchor="middle" class="tick">256×</text>
  <text x="516.0" y="518.0" text-anchor="middle" class="note">Speedup (logarithmic)</text>
  <text x="32.0" y="562.0" class="note">Wall-clock durations include scene construction; 1× is equal runtime.</text>
</svg>
