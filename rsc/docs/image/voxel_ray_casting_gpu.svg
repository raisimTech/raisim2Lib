  <path d="M232.0 219.0H310.9A4.0 4.0 0 0 1 314.9 223.0V237.0A4.0 4.0 0 0 1 310.9 241.0H232.0Z" class="other"><title>dense DDA (CUDA), terrain: 5.31 ns per ray</title></path>
