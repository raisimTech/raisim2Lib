<svg xmlns="http://www.w3.org/2000/svg" width="960" height="704" viewBox="0 0 960 704" role="img" aria-labelledby="title desc">
  <title id="title">ANYmal with random actions</title>
  <desc id="desc">ANYmal with random actions: grouped columns of the physics steps per second per dollar of RaiSim on a Core Ultra 7 265K CPU and Newton on an RTX 5070 GPU at 8 world counts. Higher is better. RaiSim is not measured at 8,192, 16,384, 32,768 worlds.</desc>
