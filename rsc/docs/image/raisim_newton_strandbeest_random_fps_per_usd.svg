  <g id="text_34">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #536579" transform="translate(69.12 381.379078)">265K: $339.99 recent advertised scenario (out of stock)  |  RTX 5070: $899.99 Newegg retail. Prices checked 15 Nov 2026.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #536579" transform="translate(69.12 392.181539)">Timed: random actions + target update + physics. No policy inference, observations, rewards or episode resets.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #536579" transform="translate(69.12 402.984)">CPU FP64 vs GPU FP32; same actions, differing solver constraints and contact trajectories.</text>
